name: Plucky GNOME validation

on:
  push:
    branches:
      - feat/plucky-gnome-llvmpipe
    paths:
      - "suites/plucky/gnomeRaw/**"
      - "tests/test_plucky_gnome.py"
      - "gen_data/gen-suite-matrix.py"
      - "build.sh"
      - ".github/workflows/plucky-gnome-validation.yml"
  pull_request:
    paths:
      - "suites/plucky/gnomeRaw/**"
      - "tests/test_plucky_gnome.py"
      - "gen_data/gen-suite-matrix.py"
      - "build.sh"
      - ".github/workflows/plucky-gnome-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out repository and fs-cook submodule
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential binfmt-support qemu-user-static debootstrap \
            python3 shellcheck

      - name: Fetch pinned debootstrap source
        env:
          DEBOOTSTRAP_VERSION: 1.0.134ubuntu1
          DEBOOTSTRAP_SHA256: e4077fc537d5edf9662305028b1ce7265ac4760086515be180b07b62d15f6a69
        run: |
          archive="$RUNNER_TEMP/debootstrap.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$archive" \
            "https://archive.ubuntu.com/ubuntu/pool/main/d/debootstrap/debootstrap_${DEBOOTSTRAP_VERSION}.tar.gz"
          echo "$DEBOOTSTRAP_SHA256  $archive" | sha256sum --check --strict
          mkdir -p fs-cook/core/debootstrap
          tar --extract --gzip --file "$archive" \
            --directory fs-cook/core/debootstrap --strip-components=1
          test -s fs-cook/core/debootstrap/debootstrap

      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Check shell syntax and style
        run: |
          bash -n build.sh
          for script in suites/plucky/gnomeRaw/*.sh; do
            bash -n "$script"
          done
          shellcheck -e SC1091,SC2034,SC2154 suites/plucky/gnomeRaw/*.sh

      - name: Build Plucky GNOME rootfs
        run: sudo bash build.sh -s plucky -v gnomeRaw -a arm64

      - name: Verify generated rootfs archive
        run: |
          archive="fs-cook/out/plucky-gnomeRaw-arm64.tar.gz"
          test -s "$archive"
          launcher_entry="$(tar -tzf "$archive" | grep -E '(^|/)usr/local/bin/udroid-gnome-x11$' | head -n 1)"
          test -n "$launcher_entry"
          tar -xOzf "$archive" "$launcher_entry" | grep -F 'GALLIUM_DRIVER=llvmpipe'

      - name: Upload tested rootfs
        uses: actions/upload-artifact@v4
        with:
          name: plucky-gnomeRaw-arm64
          path: fs-cook/out/plucky-gnomeRaw-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7
