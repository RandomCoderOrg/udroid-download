name: Build and Release
on:
  schedule: [{cron: "1 1 1 * *"}]
  workflow_dispatch: { }
  push:
    paths-ignore:
      - '**.md'
      - '**.json'
      - '.gitignore'
      - '.vscode/**'
    branches:
      - main

jobs:
  generate-matrix:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository and submodules
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Retry checkout after a transient submodule failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Fetch pinned debootstrap source
        env:
          DEBOOTSTRAP_VERSION: 1.0.134ubuntu1
          DEBOOTSTRAP_SHA256: e4077fc537d5edf9662305028b1ce7265ac4760086515be180b07b62d15f6a69
        run: |
          archive="$RUNNER_TEMP/debootstrap.tar.gz"
          curl --fail --location \
            --retry 5 --retry-all-errors \
            --output "$archive" \
            "https://archive.ubuntu.com/ubuntu/pool/main/d/debootstrap/debootstrap_${DEBOOTSTRAP_VERSION}.tar.gz"
          echo "$DEBOOTSTRAP_SHA256  $archive" | sha256sum --check --strict
          mkdir -p fs-cook/core/debootstrap
          tar --extract --gzip \
            --file "$archive" \
            --directory fs-cook/core/debootstrap \
            --strip-components=1
          test -x fs-cook/core/debootstrap/debootstrap
      - name: Pack pinned debootstrap source
        run: |
          tar -C fs-cook/core \
            --exclude=debootstrap/.git \
            -cf "$RUNNER_TEMP/debootstrap-source.tar" \
            debootstrap
      - name: Share pinned debootstrap source
        uses: actions/upload-artifact@v4.5.0
        with:
          name: debootstrap-source
          path: ${{ runner.temp }}/debootstrap-source.tar
          retention-days: 1
      - name: Generate Matrix JSON
        id: set-matrix
        run: echo "matrix=$( python3 gen_data/gen-suite-matrix.py )" >> $GITHUB_OUTPUT

  suite-build:
    runs-on: ubuntu-24.04-arm
    needs: generate-matrix
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository and submodules
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Retry checkout after a transient submodule failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Download pinned debootstrap source
        uses: actions/download-artifact@v4.1.7
        with:
          name: debootstrap-source
          path: ${{ runner.temp }}/debootstrap-source
      - name: Restore pinned debootstrap source
        run: |
          tar -C fs-cook/core \
            -xf "$RUNNER_TEMP/debootstrap-source/debootstrap-source.tar"
      - name: ⤵️ Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install git build-essential binfmt-support qemu-user-static debootstrap -y

      - name: 🛠️ Build ${{ matrix.suite }}-${{ matrix.variant }}-${{ matrix.architecture }}
        run: sudo bash build.sh -s ${{ matrix.suite }} -v ${{ matrix.variant }} -a ${{ matrix.architecture }}

      - name: ⬆️ Upload Tarballs
        uses: actions/upload-artifact@v4.5.0
        with:
          name: ${{ matrix.suite }}-${{ matrix.variant }}-${{ matrix.architecture }}-tarballs
          path: fs-cook/out/${{ matrix.suite }}-${{ matrix.variant }}-**.tar.gz

  create-release:
    runs-on: ubuntu-24.04-arm

    needs: suite-build

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 📥 Download All Tarballs
        uses: actions/download-artifact@v4.1.7

      - name: 🏷 Generate Release Tag
        run: |
          udroid_version=$(git -c 'versionsort.suffix=-' ls-remote --tags --sort='v:refname' \
              https://github.com/RandomCoderOrg/ubuntu-on-android \
              | tail -n1 | cut -d / -f 3 | cut -d v -f 2- )

          latest_tag=$(git -c 'versionsort.suffix=-' ls-remote --tags --sort='v:refname' \
            https://github.com/RandomCoderOrg/udroid-download \
            | tail -n1 | cut -d / -f 3)

          if [[ $latest_tag =~ R([0-9]+)$ ]]; then
            current_release=${BASH_REMATCH[1]}
          else
            current_release=0
          fi

          next_release=$((current_release + 1))

          echo "VERSIONTAG=V${udroid_version}R${next_release}" >> $GITHUB_ENV

      - name: 📝 Generate Release Notes
        run: sudo bash /home/runner/work/udroid-download/udroid-download/.github/scripts/generate-release-notes.sh

      - name: ⬆️ Upload Suite Tarballs
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN  }}
          tag: ${{ env.VERSIONTAG }}
          name: ${{ env.VERSIONTAG }}
          bodyFile: release.md
          draft: false
          prerelease: false
          artifacts: '*-*-tarballs/*.tar.gz'
          makeLatest: true

      - name: ⚙️ Generate New distro-data.json
        run: sudo python3 gen_data/gen-update-json.py --release-tag ${{ env.VERSIONTAG }}

      - name: ⚙️ Run git pull
        run: git pull -v

      - name: ⚙️ Update distro-data.json
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          skip_fetch: false
          skip_checkout: false
          commit_message: 'AUTO BOT JOB: (MAIN) update distro-data.json for ${{ env.VERSIONTAG }}'
          file_pattern: distro-data.json
